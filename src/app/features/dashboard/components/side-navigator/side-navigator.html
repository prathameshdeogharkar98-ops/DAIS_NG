<div class="app-layout">
  <mat-sidenav-container class="dashboard-container">

    <!-- Sidebar -->
    <mat-sidenav
      #drawer
      class="dashboard-sidenav"
      mode="side"
      [opened]="true">

      <div class="sidebar-header">
        <mat-icon>dashboard</mat-icon>
        <span>My Dashboard</span>
      </div>

      <mat-nav-list>
        <a mat-list-item
           routerLink="/dashboard"
           routerLinkActive="active-link"
           [routerLinkActiveOptions]="{ exact: true }">
          <mat-icon matListItemIcon>home</mat-icon>
          <span matListItemTitle>Home</span>
        </a>

        <a mat-list-item
           routerLink="/dashboard/users"
           routerLinkActive="active-link">
          <mat-icon matListItemIcon>people</mat-icon>
          <span matListItemTitle>Users</span>
        </a>

        <a mat-list-item
           routerLink="/dashboard/reports"
           routerLinkActive="active-link">
          <mat-icon matListItemIcon>assessment</mat-icon>
          <span matListItemTitle>Reports</span>
        </a>

        <a mat-list-item
           routerLink="/dashboard/settings"
           routerLinkActive="active-link">
          <mat-icon matListItemIcon>settings</mat-icon>
          <span matListItemTitle>Settings</span>
        </a>
      </mat-nav-list>

      <div class="sidebar-footer">
        <mat-icon>verified_user</mat-icon>
        <span>Secure Portal</span>
      </div>

    </mat-sidenav>

    <!-- Main area -->
    <mat-sidenav-content class="dashboard-main">

      <mat-toolbar class="dashboard-toolbar">
        <button
          mat-icon-button
          aria-label="Toggle navigation"
          (click)="drawer.toggle()">
          <mat-icon>menu</mat-icon>
        </button>

        <span class="toolbar-title">Application Portal</span>
        <span class="toolbar-spacer"></span>

        <button mat-icon-button aria-label="Notifications">
          <mat-icon>notifications</mat-icon>
        </button>

        <button mat-icon-button aria-label="Account">
          <mat-icon>account_circle</mat-icon>
        </button>
      </mat-toolbar>

      <!-- All child pages render here -->
      <div class="dashboard-content">
        <router-outlet></router-outlet>
      </div>

    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
